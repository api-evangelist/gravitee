  - Agentic
  - A2A
  - RAG
  - Enterprise
  properties:
  - type: Documentation
    url: https://documentation.gravitee.io/apim
  - type: GitHubRepository
    url: https://github.com/gravitee-io/gravitee-apim-mcp-server

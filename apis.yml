aid: gravitee
name: Gravitee
description: Gravitee.io is an open-source API management platform from GraviteeSource, combining a high-performance
  API Gateway, full-lifecycle API Management, Access Management (IAM), Cockpit (multi-environment control
  plane), an Alert Engine, a Kubernetes Operator, and a new AI Agent Management suite with native MCP
  and LLM-proxy capabilities. The core projects are Apache 2.0 OSS, with an Enterprise commercial offering
  and a managed Gravitee Cloud SaaS. The platform supports synchronous and asynchronous APIs across REST,
  GraphQL, WebSocket, gRPC, SSE, Webhooks, Kafka, MQTT, AMQP, and Model Context Protocol (MCP).

    url: https://github.com/gravitee-io/gravitee-policy-ai-prompt-guard-rails
  - type: GitHubRepository
    url: https://github.com/gravitee-io/gravitee-policy-ai-retrieval-augmented-generation
  - type: GitHubRepository
    url: https://github.com/gravitee-io/gravitee-resource-ai-model-api
  - type: GitHubRepository
    url: https://github.com/gravitee-io/gravitee-resource-ai-vector-store-api
  - type: GitHubRepository
    url: https://github.com/gravitee-io/gravitee-resource-ai-model-text-classification
  - type: GitHubRepository
    url: https://github.com/gravitee-io/llamaj.cpp
  features:
  - name: LLM Proxy
    description: >-
      Multi-provider proxy for OpenAI, Anthropic, Azure OpenAI, Bedrock, Mistral, Hugging Face, and self-hosted
      models behind one unified interface.
  - name: Prompt Token Tracking
    description: >-
      Meter input / output tokens per consumer, per model, per route with enforceable token limits.
  - name: Prompt Guard-Rails
    description: >-
      Apply allow / deny / classify rules to user prompts, including PII detection, before they reach
      the model.
  - name: Semantic Caching
    description: >-
      Cache LLM responses at the semantic layer to cut latency and provider cost on repeated prompts.
  - name: Retrieval-Augmented Generation
    description: RAG policy that performs vector-store lookups and injects context into prompts.
  - name: AI Vector Store Resource
    description: Pluggable vector-store resource API for embedding-based retrieval.
  - name: MCP Proxy
    description: >-
      Expose APIs as agent-ready tools using MCP standards with validation, governance, quota, and access
      controls.
  - name: MCP Tool Server / Agent Tool Server
    description: >-
      Convert existing REST and event APIs into structured, reusable agent tools with standardized definitions
      and execution patterns.
  - name: A2A Proxy
    description: >-
      Govern agent-to-agent interactions with full visibility, identity propagation, and enforced authentication,
      authorization, and policy.
  - name: Agent Catalog
    description: Centralize agent discovery, versioning, and lifecycle management across teams.
  - name: Agentic Identity and Access Management
    description: >-
      Zero-trust, context-aware authentication and fine-grained authorization unified across LLMs, agents,
      and APIs (OpenFGA + AuthZen PDP).
  - name: AI Cost and Usage Monitoring
    description: End-to-end visibility into agent activity, prompt cost, and per-tenant LLM spend.
  - name: ML Inference Service
    description: >-
      Run text-classification and embedding models in the gateway via the inference service plugin.
  useCases:
  - name: AI Cost Governance
    description: Cap and meter LLM spend by team, by route, by tenant.
  - name: Safe AI Onramp
    description: >-
      Apply prompt guard-rails, PII detection, content classification, and audit on AI workloads.
  - name: MCP-First APIs
    description: Publish enterprise APIs as MCP tools for agents and copilots.
  - name: RAG-as-a-Service
    description: Stand up retrieval-augmented endpoints powered by managed vector stores.
  - name: Agentic Zero-Trust
    description: Unified identity and fine-grained authorization across LLMs, agents, and tool calls.
  - name: Multi-Agent Workflow Governance
    description: Track and enforce policy across A2A workflows between cooperating agents.
  integrations:
  - name: OpenAI
  - name: Anthropic Claude
  - name: Azure OpenAI
  - name: AWS Bedrock
  - name: Hugging Face
  - name: Mistral
  - name: Ollama
  - name: Pinecone
  - name: Weaviate
  - name: Qdrant
  - name: Model Context Protocol
  authentication:
  - type: OAuth2
  - type: API Key
  - type: Bearer Token
  - type: mTLS
- aid: gravitee:gravitee-kafka-gateway
  name: Gravitee Kafka Gateway
  description: >-
    The Gravitee Kafka Gateway brings full API management discipline to Apache Kafka. It sits in front
    of one or more Kafka clusters and applies authentication mediation, ACLs, quotas, message filtering
    and routing, schema and serialization policies, virtual topics, and subscription workflows — exposing
    Kafka as a governed, productized event streaming surface for internal and external consumers.
  humanURL: https://www.gravitee.io/platform/kafka-gateway
  baseURL: https://documentation.gravitee.io/apim
  tags:
  - Kafka
  - Event Streaming
  - Event Gateway
  - Message Broker
  - Governance
  - Open Source
  tags_raw:
  - Kafka
  - Event Streaming
  - Event Gateway
  - Message Broker
  - Governance
  - Open Source
  - Open-Source
  properties:
  - type: Documentation
    url: https://documentation.gravitee.io/apim
  - type: GitHubRepository
    url: https://github.com/gravitee-io/gravitee-api-management
  features:
  - name: API Management for Kafka
    description: >-
      Apply policies — rate limiting, header assignment, serialization, JSON / Protobuf transformation
      — directly to Kafka streams.
  - name: Message Filtering and Routing
    description: >-
      Route and filter messages by content or headers, moving routing logic off the client and into the
      gateway.
  - name: Virtual Topics and Topic Mapping
    description: >-
      Expose user-friendly aliases for complex Kafka topic names and abstract backend topic structures
      from consumers.
  - name: Subscription Approval Workflows
    description: >-
      Customizable approval workflows that gate which consumers may subscribe to which Kafka topics.
  - name: Authentication Mediation
    description: >-
      Let consumers connect using their preferred auth (OAuth2, JWT, mTLS, SASL) while the broker keeps
      its own auth model.
  - name: Granular Access Control
    description: Fine-grained ACLs over topics, partitions, and consumer groups managed centrally.
  useCases:
  - name: Securely Expose Kafka
    description: >-
      Combine access control, authentication mediation, and approval workflows to safely expose Kafka
      to internal and external consumers.
  - name: Kafka Governance
    description: >-
      Gain visibility and control over Kafka data flows while enforcing organizational standards via policies
      and workflows.
  - name: Self-Service Streaming
    description: >-
      Let developers discover and subscribe to Kafka topics through the Gravitee Developer Portal.
  - name: Kafka TCO Reduction
    description: >-
      Cut Kafka cost through virtual topics, message offloading, and consolidated access management.
  integrations:
  - name: Apache Kafka
  - name: Confluent
  - name: RedPanda
  - name: Gravitee Developer Portal
  - name: Schema Registry
  authentication:
  - type: OAuth2
  - type: JWT
  - type: mTLS
  - type: SASL
  - type: API Key

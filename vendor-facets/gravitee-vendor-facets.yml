  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: developer-portal
  check: console_or_sandbox
  layer: composite
  provider_must: Declare the portal's endpoint-testing view as a Console entry in apis.yml common[].
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
- feature: developer-portal
  check: sign_up_present
  layer: composite
  provider_must: Allow consumer sign-up and declare the page as SignUp or Login in apis.yml common[].
  catalog_pass_rate: 0.19
  facet: access_clarity
  points: 5
  baseline_pass_rate: 0.463
- feature: developer-portal
  check: plans_present
  layer: composite
  conditional: true
  condition: >-
    Only if the provider's plans are visible publicly and describe commercial tiers — Gravitee plans are
    security/access plans (keyless, API key, JWT, OAuth2, mTLS) without prices, and the plans artifact
    is harvested from public pages.
  catalog_pass_rate: 0.172
  facet: access_clarity
  points: 8
  baseline_pass_rate: 0.44
- feature: rate-limit-headers
  check: rate_limit_signal
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    `verified` reads response headers declared in the provider's OpenAPI, matched by score.rb's /\A(x-)?ratelimit|\Aretry-after\z/i.
    Gravitee's X-Rate-Limit-* spelling does NOT match that pattern (the hyphen after "rate" breaks it);
    only the Retry-After it adds on rejection would. The headers are off by default and not written into
    the spec, so the vendor alone reaches only the `documented` fallback via a published rate_limits artifact.
  points: 7
  baseline_pass_rate: 0.381
- feature: mcp-entrypoint
  check: mcp_server
  layer: agent_readiness
  grade: templated
  note: >-
    Tools are generated from the provider's own OpenAPI and served by the provider's gateway at the API's
    /mcp path — `templated` (0.6); `verified` only when the catalog probe of the provider's mcp/ manifest
    passes. Edition not stated on the fetched page.
  points: 12
  baseline_pass_rate: 0.22
- feature: access-management-oidc
  check: auth_clarity
  layer: agent_readiness
  grade: served
  conditional: true
  condition: >-
    Only if the provider runs AM on its own host and the catalog's discovery probe reaches AM's path-scoped
    document (/{domain}/oidc/.well-known/openid-configuration) with its `issuer`; a probe of the host
    root will not find it.
  points: 10
  baseline_pass_rate: 0.474
- feature: access-management-oidc
  check: delegated_identity
  layer: agent_readiness
  grade: served
  conditional: true
  condition: >-
    Same discovery-path condition; AM supports the authorization code flow, which the served grade needs
    listed in grant_types_supported.
  points: 6
  baseline_pass_rate: 0.209
- feature: access-management-oidc
  check: dynamic_client_registration
  layer: agent_readiness
  conditional: true
  condition: >-
    Only if DCR is enabled in the AM security domain and the discovery document carrying registration_endpoint
    is reachable by the catalog probe.
  points: 6
  baseline_pass_rate: 0.134
earns_nothing:
- feature: rate-limit-policies
  check: rate_limits_documented
  why: >-
    Policies enforce limits; the check counts limits the provider publishes in a harvested rate_limits
    artifact.
- feature: developer-portal
  check: pricing_link
  why: The portal lists access plans, not prices; there is no pricing page to point at.
out_of_reach:
  checks:
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - idempotency
  - dry_run_mode
  - reversibility_documented
  - protected_resource_metadata
  - well_known_published
  - llms_txt_published
  - agent_card
  - error_semantics
  note: >-
    Nothing fetched shows Gravitee serving an oauth-protected-resource document for MCP entrypoints, and
    SDKs, llms.txt and API behaviours are the provider's.
unscored_practice:
- feature: rate-limit-headers
  why: >-
    X-Rate-Limit-* is a real, deployed spelling; score.rb's RATELIMIT_HEADER_RE matches only (x-)ratelimit*
    and Retry-After, so a Gravitee customer who faithfully declares the headers its gateway emits still
    misses `verified` unless it also declares Retry-After. Rubric input, not a mapping.
- feature: developer-portal
  why: >-
    The Developer Portal also catalogs A2A agent proxies with subscribable plans; no check reads a portal-level
    agent catalog.

# Vendor facets — Gravitee. API Management (v4 gateway, Developer Portal, plans and subscriptions, an MCP
# entrypoint that generates one tool per OpenAPI operation) plus Gravitee Access Management, a full
# OAuth/OIDC server with a discovery document and dynamic client registration. The one vendor in this set
# that can put a served authorization server on the provider's own infrastructure — but path-scoped per
# security domain. What it cannot reach: rate-limit headers the rubric recognises (off by default, and
# named X-Rate-Limit-*, which score.rb's header pattern does not match), pricing, SDKs.
vendor: gravitee
name: Gravitee
website: https://www.gravitee.io
areas:
- api-gateway
registry_keys:
- gravitee
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Gravitee reaches further into agent auth than the other gateways, but only through Access Management:
  a provider running AM serves an OIDC discovery document that advertises authorization_code and a registration_endpoint,
  which can earn auth_clarity `served`, delegated_identity `served` and dynamic_client_registration —
  conditional because AM scopes discovery under /{domain}/oidc/, not the host root. On API Management
  it earns the portal set once declared, and the MCP entrypoint serves OpenAPI-generated tools on the
  provider's own gateway (`templated`, 0.6). Its rate-limit headers are off by default and named X-Rate-Limit-*,
  a spelling score.rb's /\A(x-)?ratelimit/ header test does not match.
features:
- id: rate-limit-policies
  name: Rate Limit, Quota and Spike Arrest policies
  description: >-
    Three limiting policies with error keys RATE_LIMIT_TOO_MANY_REQUESTS / QUOTA_TOO_MANY_REQUESTS / SPIKE_ARREST_TOO_MANY_REQUESTS
    and overridable response templates.
  source: >-
    https://documentation.gravitee.io/apim/create-and-configure-apis/apply-policies/policy-reference/rate-limit
  tier: open-source
- id: rate-limit-headers
  name: addHeaders option (X-Rate-Limit-Limit / -Remaining / -Reset)
  description: >-
    When addHeaders is true (default false) the policy adds X-Rate-Limit-Limit, X-Rate-Limit-Remaining,
    X-Rate-Limit-Reset and Retry-After on rejection.
  source: https://github.com/gravitee-io/gravitee-policy-ratelimit
  tier: open-source
- id: mcp-entrypoint
  name: MCP entrypoint — Generate Tools from OpenAPI
  description: >-
    On a v4 proxy API, enabling the MCP entrypoint (path /mcp) and pasting the OpenAPI generates one tool
    per operation — name from operationId, description from summary and description, input and output
    schemas from parameters and 2xx responses.
  source: https://documentation.gravitee.io/apim/ai-agent-management/convert-your-apis-to-mcp-servers
  tier: unknown
- id: developer-portal
  name: Developer Portal
  description: >-
    Catalog where consumers discover APIs, read documentation, test endpoints, generate access tokens,
    view analytics and manage subscriptions; applications subscribe to API plans.
  source: >-
    https://documentation.gravitee.io/apim/configure-and-manage-the-platform/manage-organizations-and-environments/developer-portal
  tier: open-source
- id: access-management-oidc
  name: Gravitee Access Management — OIDC provider with DCR
  description: >-
    OAuth 2.0 / OIDC authorization server supporting the authorization code flow, with a registration_endpoint
    (POST https://<am-gateway>/{domain}/oidc/register) advertised in the OpenID discovery document.
  source: https://documentation.gravitee.io/am/guides/auth-protocols/openid-connect
  tier: open-source
maps:
- feature: developer-portal
  check: portal_present
  layer: composite
  provider_must: Declare the portal URL as a DeveloperPortal entry in apis.yml common[].
  catalog_pass_rate: 0.228
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.633
- feature: developer-portal
  check: documentation_present
  layer: composite
  provider_must: Publish documentation pages in the portal and declare them as Documentation in apis.yml

openapi: 3.2.0
info:
  title: Gravitee.io - Management Plans API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Plans
paths:
  /organizations/{orgId}/environments/{envId}/configuration/plans:
    get:
      tags:
      - Plans
      summary: List of available plan's type
      operationId: getPlansConfiguration
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansConfigurationEntity'
        '500':
          description: Internal server error
components:
  schemas:
    PlanSecurityEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        policy:
          type: string
    PlansConfigurationEntity:
      type: object
      properties:
        security:
          type: array
          items:
            $ref: '#/components/schemas/PlanSecurityEntity'
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic
x-provenance:
  method: harvested
  publisher: Gravitee
  source: https://docs.gravitee.io/apim/3.x/management-api/3.20/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);

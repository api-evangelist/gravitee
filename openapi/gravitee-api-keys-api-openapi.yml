  /organizations/{orgId}/environments/{envId}/applications/{application}/apikeys/{apikey}:
    delete:
      tags:
      - API Keys
      summary: Revoke an API key
      description: User must have the MANAGE_API_KEYS permission to use this service
      operationId: revokeApiKeyForApplication
      parameters:
      - name: apikey
        in: path
        required: true
        schema:
          type: string
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '204':
          description: API key successfully revoked
        '400':
          description: API Key does not correspond to the application
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/applications/{application}/subscriptions/{subscription}/apikeys:
    get:

components:
  schemas:
    OAuthClientSettings:
      type: object
      properties:
        application_type:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        client_uri:
          type: string
        grant_types:
          type: array
          items:
            type: string
        logo_uri:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        renew_client_secret_supported:
          type: boolean
        response_types:
          type: array
          items:
            type: string
    SimpleApplicationSettings:
      type: object
      properties:
        client_id:
          type: string
        type:
          type: string
    SubscriptionEntity:
      type: object
      properties:
        api:
          type: string
        application:
          type: string
        client_id:
          type: string
        closed_at:
          type: string
          format: date-time
        configuration:
          type: string
        consumerPausedAt:
          type: string
          format: date-time
        consumerStatus:
          $ref: '#/components/schemas/SubscriptionConsumerStatus'
        created_at:
          type: string
          format: date-time
        daysToExpirationOnLastNotification:
          type: integer
          format: int32
        ending_at:
          type: string
          format: date-time
        id:
          type: string
        keys:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        paused_at:
          type: string
          format: date-time
        plan:
          type: string
        processed_at:
          type: string
          format: date-time
        processed_by:
          type: string
        reason:
          type: string
        request:
          type: string
        security:
          type: string
        starting_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        subscribed_by:
          type: string
        updated_at:
          type: string
          format: date-time
    ApiKeyMode:
      type: string
      enum:
      - SHARED
      - EXCLUSIVE
      - UNSPECIFIED
    ApiKeyEntity:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationEntity'
        created_at:
          type: string
          format: date-time
        daysToExpirationOnLastNotification:
          type: integer
          format: int32
        expire_at:
          type: string
          format: date-time
        expired:
          type: boolean
        id:
          type: string
        key:
          type: string
        paused:
          type: boolean
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
        subscriptions:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEntity'
        updated_at:
          type: string
          format: date-time
    PrimaryOwnerEntity:
      type: object
      properties:
        displayName:
          type: string
          description: The user or group display name.
          example: John Doe
        email:
          type: string
          description: The user or group email.
          example: contact@gravitee.io
        id:
          type: string
          description: The user or group id.
          example: 005197cc-cc84-86a6-a75a-88f9772c67db
        type:
          type: string
          description: The primary owner type
          example: USER
      description: The user with role PRIMARY_OWNER on this API.
    SubscriptionConsumerStatus:
      type: string
      enum:
      - STARTED
      - STOPPED
    ApplicationEntity:
      type: object
      properties:
        api_key_mode:
          $ref: '#/components/schemas/ApiKeyMode'
        background:
          type: string
        created_at:
          type: string
          description: The date (as a timestamp) when the application was created.
          format: date-time
        description:
          type: string
          description: Application's description. A short description of your App.
          example: I can use a hundred characters to describe this App.
        disable_membership_notifications:
          type: boolean
        domain:
          type: string
          description: Domain used by the application, if relevant
          example: https://my-app.com
        groups:
          uniqueItems: true
          type: array
          description: Application groups. Used to add teams to your application.
          example: '[''MY_GROUP1'', ''MY_GROUP2'']'
          items:
            type: string
            description: Application groups. Used to add teams to your application.
            example: '[''MY_GROUP1'', ''MY_GROUP2'']'
        id:
          type: string
          description: Application's uuid.
          example: 00f8c9e7-78fc-4907-b8c9-e778fc790750
        name:
          type: string
          description: Application's name. Duplicate names can exists.
          example: My App
        owner:
          $ref: '#/components/schemas/PrimaryOwnerEntity'
        picture:
          type: string
        settings:
          $ref: '#/components/schemas/ApplicationSettings'
        status:
          type: string
          description: if the app is ACTIVE or ARCHIVED.
          example: ACTIVE
        type:
          type: string
          description: a string to describe the type of your app.
          example: iOS
        updated_at:
          type: string
          description: The last date (as a timestamp) when the application was updated.
          format: date-time
    SubscriptionStatus:
      type: string
      enum:
      - PENDING
      - REJECTED
      - ACCEPTED
      - CLOSED
      - PAUSED
      - RESUMED
    ApplicationSettings:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/SimpleApplicationSettings'
        oauth:
          $ref: '#/components/schemas/OAuthClientSettings'
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

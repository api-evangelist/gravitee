openapi: 3.2.0
info:
  title: Gravitee.io - Management API Keys API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: API Keys
paths:
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions/{subscription}/apikeys:
    get:
      tags:
      - API Keys
      summary: List all API Keys for a subscription
      description: User must have the MANAGE_API_KEYS permission to use this service
      operationId: getApiKeysForApiSubscription
      parameters:
      - name: subscription
        in: path
        required: true
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of API Keys for a subscription
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions/{subscription}/apikeys/_renew:
    post:
      tags:
      - API Keys
      summary: Renew an API key
      description: User must have the MANAGE_API_KEYS permission to use this service
      operationId: renewSubscriptionApiKeysForApiSubscription
      parameters:
      - name: subscription
        in: path
        required: true
        schema:
          type: string
      - name: customApiKey
        in: query
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '201':
          description: A new API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyEntity'
        '400':
          description: Bad custom API Key format or custom API Key definition disabled
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions/{subscription}/apikeys/{apikey}:
    put:
      tags:
      - API Keys
      summary: Update API Key
      description: User must have the API_SUBSCRIPTION:UPDATE permission to use this service
      operationId: updateApiKeyForApiSubscription
      parameters:
      - name: apikey
        in: path
        required: true
        schema:
          type: string
      - name: subscription
        in: path
        required: true
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyEntity'
        required: true
      responses:
        '200':
          description: API Key successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyEntity'
        '400':
          description: Bad API Key key format
        '500':
          description: Internal server error
    delete:
      tags:
      - API Keys
      summary: Revoke API key
      description: User must have the API_SUBSCRIPTION:DELETE permission to use this service
      operationId: revokeApiKeyForApiSubscription
      parameters:
      - name: apikey
        in: path
        required: true
        schema:
          type: string
      - name: subscription
        in: path
        required: true
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions/{subscription}/apikeys/{apikey}/_reactivate:
    post:
      tags:
      - API Keys
      summary: Reactivate an API key
      description: User must have the API_SUBSCRIPTION permission to use this service
      operationId: reactivateApiKeyForApiSubscription
      parameters:
      - name: apikey
        in: path
        required: true
        schema:
          type: string
      - name: subscription
        in: path
        required: true
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '204':
          description: API key successfully reactivated
        '400':
          description: API Key does not correspond to the subscription
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/applications/{application}/apikeys:
    get:
      tags:
      - API Keys
      summary: List all API Keys for an application
      description: User must have the READ permission to use this service
      operationId: getApiKeysForApplication
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of API Keys for application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/applications/{application}/apikeys/_renew:
    post:
      tags:
      - API Keys
      summary: Renew an API key
      description: User must have the MANAGE_API_KEYS permission to use this service
      operationId: renewApiKeyForApplicationSubscription
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path

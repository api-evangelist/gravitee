          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeEntity'
      summary: Get theme
      x-summary-source: derived
    put:
      tags:
      - Themes
      operationId: updateTheme
      parameters:
      - name: themeId
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemeEntity'
        required: true
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeEntity'
      summary: Update theme
      x-summary-source: derived
    delete:
      tags:
      - Themes
      operationId: deleteTheme
      parameters:
      - name: themeId
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path

components:
  schemas:
    NewThemeEntity:
      required:
      - name
      type: object
      properties:
        backgroundImage:
          type: string
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
        enabled:
          type: boolean
        favicon:
          type: string
        logo:
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        optionalLogo:
          type: string
    ThemeDefinition:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ThemeComponentDefinition'
    ThemeComponentDefinition:
      type: object
      properties:
        css:
          type: array
          items:
            $ref: '#/components/schemas/ThemeCssDefinition'
        name:
          type: string
    ThemeEntity:
      required:
      - name
      type: object
      properties:
        backgroundImage:
          type: string
        created_at:
          type: string
          format: date-time
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
        enabled:
          type: boolean
        favicon:
          type: string
        id:
          type: string
        logo:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        optionalLogo:
          type: string
        updated_at:
          type: string
          format: date-time
    UpdateThemeEntity:
      required:
      - definition
      - name
      type: object
      properties:
        backgroundImage:
          type: string
        definition:
          $ref: '#/components/schemas/ThemeDefinition'
        enabled:
          type: boolean
        favicon:
          type: string
        id:
          type: string
        logo:
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        optionalLogo:
          type: string
    ThemeCssType:
      type: string
      enum:
      - color
      - length
      - string
      - image
    ThemeCssDefinition:
      type: object
      properties:
        default:
          type: string
        description:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/ThemeCssType'
        value:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

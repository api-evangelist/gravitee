openapi: 3.2.0
info:
  title: Gravitee.io APIM Management Subscriptions API
  description: 'The Gravitee API Management (APIM) Management API is the administrative

    control plane for the Gravitee platform.'
  contact:
    name: GraviteeSource Team
    url: https://gravitee.io
    email: team-apim@graviteesource.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: https://{host}/management/v2
  description: APIM Management API v2 - default base URL
  variables:
    host:
      default: apim.example.com
      description: Hostname of the Gravitee APIM Management API
- url: https://{host}/management/v2/organizations/{orgId}
  description: APIM Management API v2 - per-organization base URL
  variables:
    host:
      default: apim.example.com
    orgId:
      default: DEFAULT
security:
- BasicAuth: []
- CookieAuth: []
- BearerAuth: []
tags:
- name: Subscriptions
  description: Manage subscriptions between applications and plans
paths:
  /environments/{envId}/apis/{apiId}/subscriptions:
    get:
      tags:
      - Subscriptions
      operationId: listApiSubscriptions
      summary: List Subscriptions for an API
      parameters:
      - $ref: '#/components/parameters/EnvId'
      - $ref: '#/components/parameters/ApiId'
      responses:
        '200':
          description: Subscriptions page
  /environments/{envId}/subscriptions:
    get:
      tags:
      - Subscriptions
      operationId: listSubscriptions
      summary: List Subscriptions
      parameters:
      - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: Subscriptions page
    post:
      tags:
      - Subscriptions
      operationId: createSubscription
      summary: Create a Subscription
      parameters:
      - $ref: '#/components/parameters/EnvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
      responses:
        '201':
          description: Subscription created
  /environments/{envId}/subscriptions/{subscriptionId}:
    get:
      tags:
      - Subscriptions
      operationId: getSubscription
      summary: Get a Subscription
      parameters:
      - $ref: '#/components/parameters/EnvId'
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The subscription
  /environments/{envId}/subscriptions/{subscriptionId}/_accept:
    post:
      tags:
      - Subscriptions
      operationId: acceptSubscription
      summary: Accept a Subscription
      parameters:
      - $ref: '#/components/parameters/EnvId'
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subscription accepted
  /environments/{envId}/subscriptions/{subscriptionId}/_reject:
    post:
      tags:
      - Subscriptions
      operationId: rejectSubscription
      summary: Reject a Subscription
      parameters:
      - $ref: '#/components/parameters/EnvId'
      - in: path
        name: subscriptionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subscription rejected
components:
  parameters:
    EnvId:
      in: path
      name: envId
      required: true
      schema:
        type: string
      description: The environment identifier
    ApiId:
      in: path
      name: apiId
      required: true
      schema:
        type: string
      description: The API identifier
  schemas:
    Subscription:
      type: object
      properties:
        id:
          type: string
        api:
          type: string
        plan:
          type: string
        application:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - CLOSED
          - PAUSED
          - RESUMED
        createdAt:
          type: string
          format: date-time
        startingAt:
          type: string
          format: date-time
        endingAt:
          type: string
          format: date-time
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      in: cookie
      name: Auth-Graviteeio-APIM
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

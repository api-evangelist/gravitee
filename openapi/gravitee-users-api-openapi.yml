components:
  schemas:
    UserReferenceRoleEntity:
      type: object
      properties:
        referenceId:
          type: string
        referenceType:
          $ref: '#/components/schemas/MembershipReferenceType'
        roles:
          type: array
          items:
            type: string
        user:
          type: string
    MembershipReferenceType:
      type: string
      enum:
      - APPLICATION
      - API
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    UserRoleEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
    UserGroupEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        roles:
          type: object
          additionalProperties:
            type: string
    UserPageResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserEntity'
        metadata:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        page:
          $ref: '#/components/schemas/Page'
    UserMembershipList:
      type: object
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/UserMembership'
        metadata:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
    Page:
      type: object
      properties:
        current:
          type: integer
          format: int32
        per_page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elements:
          type: integer
          format: int32
        total_pages:
          type: integer
          format: int32
    SearchableUser:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        firstname:
          type: string
        id:
          type: string
        lastname:
          type: string
        picture:
          type: string
        reference:
          type: string
    RoleScope:
      type: string
      enum:
      - API
      - APPLICATION
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    UserEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        customFields:
          type: object
          additionalProperties:
            type: object
        displayName:
          type: string
          readOnly: true
        email:
          type: string
        envRoles:
          type: object
          additionalProperties:
            uniqueItems: true
            type: array
            items:
              $ref: '#/components/schemas/UserRoleEntity'
        firstConnectionAt:
          type: string
          format: date-time
        firstname:
          type: string
        id:
          type: string
        lastConnectionAt:
          type: string
          format: date-time
        lastname:
          type: string
        loginCount:
          type: integer
          format: int64
        newsletterSubscribed:
          type: boolean
        number_of_active_tokens:
          type: integer
          format: int32
        password:
          type: string
        picture:
          type: string
        primary_owner:
          type: boolean
        roles:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/UserRoleEntity'
        source:
          type: string
        sourceId:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    UserMembership:
      type: object
      properties:
        reference:
          type: string
        roles:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
        type:
          type: string
    NewPreRegisterUserEntity:
      required:

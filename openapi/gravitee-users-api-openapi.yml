        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        newsletter:
          type: boolean
        picture:
          type: string
        service:
          type: boolean
        source:
          type: string
        sourceId:
          type: string
    ResetPasswordUserEntity:
      required:
      - firstname
      - lastname
      - password
      - token
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        password:

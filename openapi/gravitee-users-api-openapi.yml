openapi: 3.2.0
info:
  title: Gravitee.io - Management Users API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Users
paths:
  /organizations/{orgId}/environments/{envId}/search/users:
    get:
      tags:
      - Users
      summary: Search for users
      operationId: searchUsers
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchableUser'
        '400':
          description: Bad query parameter
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/users:
    get:
      tags:
      - Users
      summary: Search for users using the search engine
      description: User must have the ORGANIZATION_USERS[READ] permission to use this service
      operationId: getAllUsers
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List users matching the query criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResult'
        '500':
          description: Internal server error
    post:
      tags:
      - Users
      summary: Create a user
      description: User must have the ORGANIZATION_USERS[CREATE] permission to use this service
      operationId: createUser
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId

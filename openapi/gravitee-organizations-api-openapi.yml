openapi: 3.2.0
info:
  title: Gravitee.io - Management Organizations API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Organizations
paths:
  /organizations/{orgId}/environments:
    get:
      summary: List available environments for current user organization
      operationId: getEnvironments
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentEntity'
      tags:
      - Organizations
  /organizations/{orgId}/environments/permissions:
    get:
      summary: List available environments with their permissions for current user organization
      operationId: getEnvironmentsPermissions
      parameters:
      - name: idOrHrid
        in: query
        description: To filter on environment id or hrid
        schema:
          type: string
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Current user permissions on its environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentPermissionsEntity'
        '500':
          description: Internal server error
      tags:
      - Organizations
  /organizations/{orgId}/environments/{envId}/identities:
    get:
      summary: Get the list of identity provider activations for current environment
      description: User must have the ENVIRONMENT_IDENTITY_PROVIDER_ACTIVATION[READ] permission to use this service
      operationId: getIdentityProviderActivations
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List identity provider activations for current environment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderActivationEntity'
        '500':
          description: Internal server error
      tags:
      - Organizations
  /organizations/{orgId}/environments/{envId}/permissions:
    get:
      summary: Get permissions on environment
      operationId: getEnvironmentPermissions
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Current user permissions on environement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionMap'
        '500':
          description: Internal server error
      tags:
      - Organizations
  /organizations/{orgId}/identities:
    get:
      summary: Get the list of identity provider activations for current organization
      description: User must have the ORGANIZATION_IDENTITY_PROVIDER_ACTIVATION[READ] permission to use this service
      operationId: listIdentityProviderActivations
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List identity provider activations for current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderActivationEntity'
        '500':
          description: Internal server error
      tags:
      - Organizations
components:
  schemas:
    IdentityProviderActivationReferenceType:
      type: string
      enum:
      - ENVIRONMENT
      - ORGANIZATION
    EnvironmentEntity:
      required:
      - name
      - organizationId
      type: object
      properties:
        cockpitId:
          type: string
        description:
          type: string
        domainRestrictions:
          type: array
          items:
            type: string
        hrids:
          type: array
          items:
            type: string
        id:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        organizationId:
          type: string
    PermissionMap:
      type: object
      additionalProperties:
        uniqueItems: true
        type: array
        items:
          maxLength: 1
          minLength: 1
          type: string
    EnvironmentPermissionsEntity:
      required:
      - name
      type: object
      properties:
        hrids:
          type: array
          items:
            type: string
        id:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    IdentityProviderActivationEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        identityProvider:
          type: string
        referenceId:
          type: string
        referenceType:
          $ref: '#/components/schemas/IdentityProviderActivationReferenceType'
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

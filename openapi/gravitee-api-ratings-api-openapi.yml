components:
  schemas:
    NewRatingEntity:
      type: object
      properties:
        api:
          type: string
        comment:
          maxLength: 1024
          minLength: 0
          type: string
        rate:
          type: string
          format: byte
        title:
          maxLength: 64
          minLength: 0
          type: string
    UpdateRatingEntity:
      type: object
      properties:
        api:
          type: string
        comment:
          maxLength: 1024
          minLength: 0
          type: string
        id:
          type: string
        rate:
          type: string
          format: byte
        title:
          maxLength: 64
          minLength: 0
          type: string
    NewRatingAnswerEntity:
      type: object
      properties:
        comment:
          maxLength: 1024
          minLength: 0
          type: string
        ratingId:
          type: string
    PageRatingEntity:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RatingEntity'
        pageElements:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    RatingSummaryEntity:
      type: object
      properties:
        api:
          type: string
        averageRate:
          type: number
          format: double
        numberOfRatings:
          type: integer
          format: int32
        numberOfRatingsByRate:
          type: object
          additionalProperties:
            type: integer
            format: int64
    RatingAnswerEntity:
      type: object
      properties:
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        user:
          type: string
        userDisplayName:
          type: string
    RatingEntity:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/RatingAnswerEntity'
        api:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        rate:
          type: string
          format: byte
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        user:

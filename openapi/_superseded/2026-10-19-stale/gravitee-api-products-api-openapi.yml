openapi: 3.2.0
info:
  title: Gravitee.io APIM Management API Products API
  description: 'The Gravitee API Management (APIM) Management API is the administrative

    control plane for the Gravitee platform.'
  contact:
    name: GraviteeSource Team
    url: https://gravitee.io
    email: team-apim@graviteesource.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: https://{host}/management/v2
  description: APIM Management API v2 - default base URL
  variables:
    host:
      default: apim.example.com
      description: Hostname of the Gravitee APIM Management API
- url: https://{host}/management/v2/organizations/{orgId}
  description: APIM Management API v2 - per-organization base URL
  variables:
    host:
      default: apim.example.com
    orgId:
      default: DEFAULT
security:
- BasicAuth: []
- CookieAuth: []
- BearerAuth: []
tags:
- name: API Products
  description: Bundle one or more APIs into a publishable API product
paths:
  /environments/{envId}/api-products:
    get:
      tags:
      - API Products
      operationId: getApiProducts
      summary: List API Products
      parameters:
      - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: API products page
    post:
      tags:
      - API Products
      operationId: createApiProduct
      summary: Create an API Product
      parameters:
      - $ref: '#/components/parameters/EnvId'
      responses:
        '201':
          description: API product created
  /environments/{envId}/api-products/_search:
    post:
      tags:
      - API Products
      operationId: searchApiProducts
      summary: Search API Products
      parameters:
      - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: Matching API products
  /environments/{envId}/api-products/{apiProductId}:
    put:
      tags:
      - API Products
      operationId: updateApiProduct
      summary: Update an API Product
      parameters:
      - $ref: '#/components/parameters/EnvId'
      - in: path
        name: apiProductId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: API product updated
    delete:
      tags:
      - API Products
      operationId: deleteApiProduct
      summary: Delete an API Product
      parameters:
      - $ref: '#/components/parameters/EnvId'
      - in: path
        name: apiProductId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: API product deleted
components:
  parameters:
    EnvId:
      in: path
      name: envId
      required: true
      schema:
        type: string
      description: The environment identifier
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      in: cookie
      name: Auth-Graviteeio-APIM
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

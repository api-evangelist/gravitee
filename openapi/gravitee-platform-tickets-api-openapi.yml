components:
  schemas:
    TicketEntityPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketEntity'
        pageElements:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    TicketEntity:
      type: object
      properties:
        api:
          type: string
        application:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        from_user:
          type: string
        id:
          type: string
        subject:
          type: string
    NewTicketEntity:
      required:
      - content
      - subject
      type: object
      properties:
        api:
          type: string
        application:
          type: string
        content:
          type: string
        copyToSender:
          type: boolean
        subject:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

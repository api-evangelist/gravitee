  /organizations/{orgId}/user/avatar:
    get:
      tags:
      - Current User
      summary: Get user's avatar
      operationId: getCurrentUserPicture
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: User's avatar
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: User not found
        '500':
          description: Internal server error
  /organizations/{orgId}/user/login:
    post:
      tags:
      - Current User
      summary: Login
      operationId: login
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /organizations/{orgId}/user/logout:
    post:
      tags:
      - Current User
      summary: Logout
      operationId: logoutCurrentUser
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:

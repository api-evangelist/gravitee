components:
  schemas:
    TaskEntityPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskEntity'
        metadata:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        page:
          $ref: '#/components/schemas/Page'
    UserDetailRole:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          type: string
    UserRoleEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
    TaskType:
      type: string
      enum:
      - SUBSCRIPTION_APPROVAL
      - IN_REVIEW
      - REQUEST_FOR_CHANGES
      - USER_REGISTRATION_APPROVAL
      - PROMOTION_APPROVAL
    GrantedAuthority:
      type: object
      properties:
        authority:
          type: string
    Page:
      type: object
      properties:
        current:
          type: integer
          format: int32
        per_page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elements:
          type: integer
          format: int32
        total_pages:
          type: integer
          format: int32
    UpdateUserEntity:
      type: object
      properties:
        customFields:
          type: object
          additionalProperties:
            type: object
        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        newsletter:
          type: boolean
        picture:
          type: string
        status:
          type: string
    RoleScope:
      type: string
      enum:
      - API
      - APPLICATION
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    TaskEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        data:
          type: object
        type:
          $ref: '#/components/schemas/TaskType'
    UserEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        customFields:
          type: object
          additionalProperties:
            type: object
        displayName:
          type: string
          readOnly: true
        email:
          type: string
        envRoles:
          type: object
          additionalProperties:
            uniqueItems: true
            type: array
            items:
              $ref: '#/components/schemas/UserRoleEntity'
        firstConnectionAt:
          type: string
          format: date-time
        firstname:
          type: string
        id:
          type: string
        lastConnectionAt:
          type: string
          format: date-time
        lastname:
          type: string
        loginCount:
          type: integer
          format: int64
        newsletterSubscribed:
          type: boolean
        number_of_active_tokens:
          type: integer
          format: int32
        password:
          type: string
        picture:
          type: string
        primary_owner:
          type: boolean
        roles:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/UserRoleEntity'
        source:
          type: string
        sourceId:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    UserDetails:
      type: object
      properties:
        authorities:
          type: array
          items:
            $ref: '#/components/schemas/GrantedAuthority'
        created_at:
          type: string
          format: date-time
        customFields:
          type: object
          additionalProperties:
            type: object
        displayName:
          type: string
        displayNewsletterSubscription:
          type: boolean
        email:
          type: string
        enabled:
          type: boolean
        firstLogin:
          type: boolean
        firstname:
          type: string
        groupsByEnvironment:
          type: object
          additionalProperties:
            uniqueItems: true
            type: array
            items:
              type: string
        id:
          type: string
        last_connection_at:
          type: string
          format: date-time
        lastname:
          type: string
        picture:
          type: array
          items:
            type: string
            format: byte
        primaryOwner:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserDetailRole'
        source:
          type: string
        sourceId:
          type: string
        system:
          type: boolean
        updated_at:
          type: string
          format: date-time
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic
x-provenance:
  method: harvested
  publisher: Gravitee
  source: https://docs.gravitee.io/apim/3.x/management-api/3.20/swagger.json

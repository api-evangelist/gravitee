openapi: 3.2.0
info:
  title: Gravitee.io - Management Current User API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Current User
paths:
  /organizations/{orgId}/environments/{envId}/user:
    get:
      tags:
      - Current User
      summary: Get the authenticated user
      operationId: getCurrentUser_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '401':
          description: Unauthorized user
        '500':
          description: Internal server error
    put:
      tags:
      - Current User
      summary: Update the authenticated user
      operationId: updateCurrentUser_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UpdateUserEntity'
        required: true
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '400':
          description: Invalid user profile
        '404':
          description: User not found
        '500':
          description: Internal server error
    delete:
      tags:
      - Current User
      summary: Delete the current logged user
      operationId: deleteCurrentUser_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '204':
          description: Current user successfully deleted
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/user/avatar:
    get:
      tags:
      - Current User
      summary: Get user's avatar
      operationId: getCurrentUserPicture_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: User's avatar
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: User not found
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/user/login:
    post:
      tags:
      - Current User
      summary: Login
      operationId: login_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /organizations/{orgId}/environments/{envId}/user/logout:
    post:
      tags:
      - Current User
      summary: Logout
      operationId: logoutCurrentUser_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            '*/*': {}
  /organizations/{orgId}/environments/{envId}/user/tags:
    get:
      tags:
      - Current User
      summary: Get the user's allowed sharding tags
      operationId: getUserShardingTags_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: User's sharding tags
          content:
            application/json:
              schema:
                uniqueItems: true
                type: array
                items:
                  type: string
        '404':
          description: User not found
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/user/tasks:
    get:
      tags:
      - Current User
      summary: Get the user's tasks
      operationId: getUserTasks_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: User's tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEntityPagedResult'
        '404':
          description: User not found
        '500':
          description: Internal server error
  /organizations/{orgId}/user:
    get:
      tags:
      - Current User
      summary: Get the authenticated user
      operationId: getCurrentUser
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':

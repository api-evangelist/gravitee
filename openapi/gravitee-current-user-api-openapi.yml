  /organizations/{orgId}/user/tasks:
    get:
      tags:
      - Current User
      summary: Get the user's tasks
      operationId: getUserTasks
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: User's tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEntityPagedResult'

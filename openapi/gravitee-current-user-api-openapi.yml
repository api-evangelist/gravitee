  /organizations/{orgId}/user/tags:
    get:
      tags:
      - Current User
      summary: Get the user's allowed sharding tags
      operationId: getUserShardingTags
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true

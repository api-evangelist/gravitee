components:
  schemas:
    UpdateRoleEntity:
      required:
      - id
      - name
      - scope
      type: object
      properties:
        default:
          type: boolean
        description:
          type: string
        id:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
    MembershipListItem:
      type: object
      properties:
        displayName:
          type: string
        id:
          type: string
        role:
          type: string
    RoleMembership:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
    RoleEntity:
      required:
      - id
      type: object
      properties:
        apiPrimaryOwner:
          type: boolean
        default:
          type: boolean
        description:
          type: string
        id:
          type: string
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
        system:
          type: boolean
    RoleScope:
      type: string
      enum:
      - API
      - APPLICATION
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    NewRoleEntity:
      required:
      - name
      - scope
      type: object
      properties:
        default:
          type: boolean
        description:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
    RoleScopesLinkedHashMap:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

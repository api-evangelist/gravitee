openapi: 3.2.0
info:
  title: Gravitee.io APIM Management UI API
  description: 'The Gravitee API Management (APIM) Management API is the administrative

    control plane for the Gravitee platform.'
  contact:
    name: GraviteeSource Team
    url: https://gravitee.io
    email: team-apim@graviteesource.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: https://{host}/management/v2
  description: APIM Management API v2 - default base URL
  variables:
    host:
      default: apim.example.com
      description: Hostname of the Gravitee APIM Management API
- url: https://{host}/management/v2/organizations/{orgId}
  description: APIM Management API v2 - per-organization base URL
  variables:
    host:
      default: apim.example.com
    orgId:
      default: DEFAULT
security:
- BasicAuth: []
- CookieAuth: []
- BearerAuth: []
tags:
- name: UI
  description: Customize developer portal and console themes
paths:
  /ui/themes:
    get:
      tags:
      - UI
      operationId: listUiThemes
      summary: List UI Themes
      responses:
        '200':
          description: UI themes
    post:
      tags:
      - UI
      operationId: createUiTheme
      summary: Create a UI Theme
      responses:
        '201':
          description: Theme created
  /ui/themes/_current:
    get:
      tags:
      - UI
      operationId: getCurrentUiTheme
      summary: Get the Current UI Theme
      responses:
        '200':
          description: The current theme
  /ui/customization:
    get:
      tags:
      - UI
      operationId: getUiCustomization
      summary: Get UI Customization
      responses:
        '200':
          description: UI customization
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      in: cookie
      name: Auth-Graviteeio-APIM
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

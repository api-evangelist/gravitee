openapi: 3.2.0
info:
  title: Gravitee.io - Management Application Metadata API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Application Metadata
paths:
  /organizations/{orgId}/environments/{envId}/applications/{application}/metadata:
    get:
      tags:
      - Application Metadata
      summary: List metadata for an application
      description: User must have the APPLICATION_METADATA[READ] permission to use this service
      operationId: getApplicationMetadatas
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of metadata for an application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationMetadataEntity'
        '500':
          description: Internal server error
    post:
      tags:
      - Application Metadata
      summary: Create an application metadata
      description: User must have the APPLICATION_METADATA[CREATE] permission to use this service
      operationId: createApplicationMetadata
      parameters:
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApplicationMetadataEntity'
        required: true
      responses:
        '201':
          description: Application metadata successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationMetadataEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/applications/{application}/metadata/{metadata}:
    get:
      tags:
      - Application Metadata
      summary: A metadata for an application and metadata id
      description: User must have the APPLICATION_METADATA[READ] permission to use this service
      operationId: getApplicationMetadata
      parameters:
      - name: metadata
        in: path
        required: true
        schema:
          type: string
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: A metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationMetadataEntity'
        '404':
          description: Metadata not found
        '500':
          description: Internal server error
    put:
      tags:
      - Application Metadata
      summary: Update an application metadata
      description: User must have the APPLICATION_METADATA[UPDATE] permission to use this service
      operationId: updateApplicationMetadata
      parameters:
      - name: metadata
        in: path
        required: true
        schema:
          type: string
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationMetadataEntity'
        required: true
      responses:
        '200':
          description: Updated application metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationMetadataEntity'
        '500':
          description: Internal server error
    delete:
      tags:
      - Application Metadata
      summary: Delete a metadata
      description: User must have the APPLICATION_METADATA[DELETE] permission to use this service
      operationId: deleteApplicationMetadata
      parameters:
      - name: metadata
        in: path
        required: true
        schema:
          type: string
      - name: application
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '204':
          description: Metadata successfully deleted
        '500':
          description: Internal server error
components:
  schemas:
    MetadataFormat:
      type: string
      enum:
      - STRING
      - NUMERIC
      - BOOLEAN
      - DATE
      - MAIL
      - URL
    ApplicationMetadataEntity:
      required:
      - key
      - value
      type: object
      properties:
        applicationId:
          type: string
        defaultValue:
          type: string
        format:
          $ref: '#/components/schemas/MetadataFormat'
        key:
          maxLength: 2147483647
          minLength: 1
          type: string
        name:
          type: string
        value:
          maxLength: 2147483647
          minLength: 1
          type: string
    UpdateApplicationMetadataEntity:
      required:
      - name
      type: object
      properties:
        applicationId:
          type: string
        defaultValue:
          type: string
        format:
          $ref: '#/components/schemas/MetadataFormat'
        hidden:
          type: boolean
        key:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        value:
          type: string
    NewApplicationMetadataEntity:
      required:
      - name
      type: object
      properties:
        applicationId:
          type: string
        defaultValue:
          type: string
        format:
          $ref: '#/components/schemas/MetadataFormat'
        hidden:
          type: boolean
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        value:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

openapi: 3.2.0
info:
  title: Gravitee.io - Management Plugins API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Plugins
paths:
  /organizations/{orgId}/environments/{envId}/connectors:
    get:
      tags:
      - Plugins
      summary: List connector plugins
      description: User must have the ENVIRONMENT_API[READ] permission to use this service
      operationId: getConnectors
      parameters:
      - name: expand
        in: query
        schema:
          type: array
          items:
            type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorListItem'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/connectors/{connector}:

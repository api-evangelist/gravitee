components:
  schemas:
    PlatformPluginEntity:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        version:
          type: string
    FetcherListItem:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        schema:
          type: string
        version:
          type: string
    PolicyEntity:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        dev:
          $ref: '#/components/schemas/PolicyDevelopmentEntity'
        id:
          type: string
        name:
          type: string
        plugin:
          $ref: '#/components/schemas/PluginEntity'
        type:
          $ref: '#/components/schemas/PolicyType'
        version:
          type: string
    FetcherEntity:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        version:
          type: string
    NotifierListItem:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        schema:
          type: string
        version:
          type: string
    PolicyListItem:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        documentation:
          type: string
        icon:
          type: string
        id:
          type: string
        name:
          type: string
        onRequest:
          type: boolean
        onResponse:
          type: boolean
        schema:
          type: string
        type:
          $ref: '#/components/schemas/PolicyType'
        version:
          type: string
    ConnectorListItem:
      type: object
      properties:
        description:
          type: string
        icon:
          type: string
        id:
          type: string
        name:
          type: string
        schema:
          type: string
        supportedTypes:
          type: array
          items:
            type: string
        version:
          type: string
    NotifierEntity:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        plugin:
          $ref: '#/components/schemas/PluginEntity'
        version:
          type: string
    PluginEntity:
      type: object
      properties:
        dependencies:
          type: array
          items:
            type: string
            format: url
        description:
          type: string
        id:
          type: string
        name:
          type: string
        path:
          type: string
        plugin:
          type: string
        type:
          type: string
        version:
          type: string
    PolicyType:
      type: string
      enum:
      - REQUEST
      - RESPONSE
      - REQUEST_RESPONSE
    ResourceListItem:

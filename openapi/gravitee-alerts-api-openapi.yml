openapi: 3.2.0
info:
  title: Gravitee.io - Management Alerts API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Alerts
paths:
  /organizations/{orgId}/environments/{envId}/alerts/metrics:
    get:
      tags:
      - Alerts
      summary: List alert metrics
      operationId: getAlertMetrics
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertMetric'
components:
  schemas:
    AlertThreshold:
      type: object
      properties:
        description:
          type: string
        key:
          type: string
    AlertMetric:
      type: object
      properties:
        description:
          type: string
        key:
          type: string
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/AlertThreshold'
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

components:
  schemas:
    MembershipReferenceType:
      type: string
      enum:
      - APPLICATION
      - API
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    RoleEntity:
      required:
      - id
      type: object
      properties:
        apiPrimaryOwner:
          type: boolean
        default:
          type: boolean
        description:
          type: string
        id:
          type: string
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
        system:
          type: boolean
    RoleScope:
      type: string
      enum:
      - API
      - APPLICATION
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    ApiMembership:
      required:
      - role
      type: object
      properties:
        id:
          type: string
          description: User's technical identifier.
        reference:
          type: string
          description: User's reference for user providing from an identity provider.
        role:
          type: string
          description: Role's name
    MembershipMemberType:
      type: string
      description: Type's name
      example: USER
      enum:
      - USER
      - GROUP
    MemberEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        referenceId:
          type: string
        referenceType:
          $ref: '#/components/schemas/MembershipReferenceType'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEntity'
        type:
          $ref: '#/components/schemas/MembershipMemberType'
        updated_at:
          type: string
          format: date-time
    TransferOwnership:
      required:
      - role
      - type
      type: object
      properties:
        id:
          type: string
          description: User's technical identifier.
        reference:
          type: string
          description: User's reference for user providing from an identity provider.
        role:
          type: string
          description: Role's name
        type:
          $ref: '#/components/schemas/MembershipMemberType'
    MembershipListItem:
      type: object
      properties:
        displayName:
          type: string
        id:
          type: string
        role:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

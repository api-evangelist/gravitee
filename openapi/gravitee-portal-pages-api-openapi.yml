    get:
      tags:
      - Portal Pages
      summary: List pages
      description: Every users can use this service
      operationId: getPortalPages
      parameters:
      - name: Accept-Language
        in: header
        schema:
          type: string
      - name: homepage
        in: query
        schema:
          type: boolean
      - name: published
        in: query
        schema:
          type: boolean
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/PageType'
      - name: parent
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: root
        in: query
        schema:
          type: boolean
      - name: translated
        in: query
        schema:
          type: boolean
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageEntity'
        '500':
          description: Internal server error
    post:
      tags:
      - Portal Pages
      summary: Create a page
      description: User must have the ENVIRONMENT_DOCUMENTATION[CREATE] permission to use this service
      operationId: createPortalPage
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPageEntity'
        required: true
      responses:
        '201':
          description: Page successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/portal/pages/_fetch:

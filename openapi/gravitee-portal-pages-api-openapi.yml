      description: User must have the ENVIRONMENT_DOCUMENTATION[CREATE] permission to use this service
      operationId: importPortalPageFromFiles
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:

  /organizations/{orgId}/environments/{envId}/portal/pages/{page}/content:
    get:
      tags:
      - Portal Pages
      summary: Get the page's content
      description: Every users can use this service
      operationId: getPortalPageContent
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Page's content
          content:
            text/plain:
              schema:

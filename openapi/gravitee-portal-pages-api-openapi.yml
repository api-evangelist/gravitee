      summary: Import pages
      description: User must have the ENVIRONMENT_DOCUMENTATION[CREATE] permission to use this service
      operationId: updateImportedPortalPageFromFiles
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path

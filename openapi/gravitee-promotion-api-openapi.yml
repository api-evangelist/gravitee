openapi: 3.2.0
info:
  title: Gravitee.io - Management Promotion API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Promotion
paths:
  /organizations/{orgId}/environments/{envId}/promotion-targets:
    get:
      tags:
      - Promotion
      summary: List available targets (environments) for a promotion
      operationId: getPromotionTargets
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of promotion targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionTargetEntity'
        '500':
          description: Internal server error
        '503':
          description: Installation not connected to cockpit
  /organizations/{orgId}/promotions/{promotion}/_process:
    post:
      tags:
      - Promotion
      summary: Process an API promotion by accepting or rejecting it
      operationId: processPromotion
      parameters:
      - name: promotion
        in: path
        description: The ID of the promotion
        required: true
        schema:
          type: string
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              type: boolean
      responses:
        '200':
          description: Processed promotion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionEntity'
        '404':
          description: Promotion not found
        '500':
          description: Internal server error
components:
  schemas:
    PromotionEntity:
      type: object
      properties:
        apiDefinition:
          type: string
        apiId:
          type: string
        author:
          $ref: '#/components/schemas/PromotionEntityAuthor'
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        sourceEnvCockpitId:
          type: string
        sourceEnvName:
          type: string
        status:
          $ref: '#/components/schemas/PromotionEntityStatus'
        targetApiId:
          type: string
        targetEnvCockpitId:
          type: string
        targetEnvName:
          type: string
        updatedAt:
          type: string
          format: date-time
    PromotionEntityAuthor:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        picture:
          type: string
        source:
          type: string
        sourceId:
          type: string
        userId:
          type: string
    PromotionTargetEntity:
      required:
      - installationId
      - name
      - organizationId
      type: object
      properties:
        description:
          type: string
        hrids:
          type: array
          items:
            type: string
        id:
          type: string
        installationId:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        organizationId:
          type: string
    PromotionEntityStatus:
      type: string
      enum:
      - CREATED
      - TO_BE_VALIDATED
      - ACCEPTED
      - REJECTED
      - ERROR
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic
x-provenance:
  method: harvested
  publisher: Gravitee
  source: https://docs.gravitee.io/apim/3.x/management-api/3.20/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)

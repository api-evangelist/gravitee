openapi: 3.2.0
info:
  title: Gravitee.io - Management Platform Events API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Platform Events
paths:
  /organizations/{orgId}/environments/{envId}/platform/events:
    get:
      tags:
      - Platform Events
      summary: List platform events
      description: User must have the MANAGEMENT_PLATFORM[READ] permission to use this service
      operationId: getPlatformEvents
      parameters:
      - name: type
        in: query
        explode: false
        schema:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/EventType'
      - name: from
        in: query
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: api_ids
        in: query
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Platform events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEntityPage'
        '500':
          description: Internal server error
components:
  schemas:
    EventEntityPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EventEntity'
        pageElements:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    UserRoleEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
    RoleScope:
      type: string
      enum:
      - API
      - APPLICATION
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    UserEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        customFields:
          type: object
          additionalProperties:
            type: object
        displayName:
          type: string
          readOnly: true
        email:
          type: string
        envRoles:
          type: object
          additionalProperties:
            uniqueItems: true
            type: array
            items:
              $ref: '#/components/schemas/UserRoleEntity'
        firstConnectionAt:
          type: string
          format: date-time
        firstname:
          type: string
        id:
          type: string
        lastConnectionAt:
          type: string
          format: date-time
        lastname:
          type: string
        loginCount:
          type: integer
          format: int64
        newsletterSubscribed:
          type: boolean
        number_of_active_tokens:
          type: integer
          format: int32
        password:
          type: string
        picture:
          type: string
        primary_owner:
          type: boolean
        roles:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/UserRoleEntity'
        source:
          type: string
        sourceId:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    EventEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        environments:
          uniqueItems: true
          type: array
          items:
            type: string
        id:
          type: string
        parentId:
          type: string
        payload:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        type:
          $ref: '#/components/schemas/EventType'
        updated_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserEntity'
    EventType:
      type: string
      enum:
      - PUBLISH_API
      - PUBLISH_API_RESULT
      - UNPUBLISH_API
      - UNPUBLISH_API_RESULT
      - START_API
      - STOP_API
      - GATEWAY_STARTED
      - GATEWAY_STOPPED
      - PUBLISH_DICTIONARY
      - UNPUBLISH_DICTIONARY
      - START_DICTIONARY
      - STOP_DICTIONARY
      - ALERT_NOTIFICATION
      - PUBLISH_ORGANIZATION
      - DEBUG_API
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

components:
  schemas:
    MetadataFormat:
      type: string
      enum:
      - STRING
      - NUMERIC
      - BOOLEAN
      - DATE
      - MAIL
      - URL
    NewApiMetadataEntity:
      required:
      - name
      type: object
      properties:
        apiId:
          type: string
        defaultValue:
          type: string
        format:
          $ref: '#/components/schemas/MetadataFormat'
        hidden:
          type: boolean
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        value:
          type: string
    ApiMetadataEntity:
      required:
      - key
      - value
      type: object
      properties:
        apiId:
          type: string
        defaultValue:
          type: string
        format:
          $ref: '#/components/schemas/MetadataFormat'
        key:
          maxLength: 2147483647
          minLength: 1
          type: string
        name:
          type: string
        value:
          maxLength: 2147483647
          minLength: 1
          type: string
    UpdateApiMetadataEntity:
      required:
      - name
      type: object
      properties:
        apiId:
          type: string
        defaultValue:
          type: string
        format:
          $ref: '#/components/schemas/MetadataFormat'
        hidden:
          type: boolean
        key:
          type: string
        name:
          maxLength: 2147483647
          minLength: 1
          type: string
        value:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

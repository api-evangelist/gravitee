openapi: 3.2.0
info:
  title: Gravitee.io - Management User Registration API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: User Registration
paths:
  /organizations/{orgId}/environments/{envId}/users/registration:
    post:
      tags:
      - User Registration
      summary: Register a user
      description: User registration must be enabled
      operationId: registerUser
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExternalUserEntity'
      responses:
        '200':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/users/registration/finalize:
    post:
      tags:
      - User Registration
      summary: Finalize user registration
      description: User registration must be enabled
      operationId: finalizeUserRegistration
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserEntity'
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/users/registration:
    post:
      tags:
      - User Registration
      summary: Register a user
      description: User registration must be enabled
      operationId: registerUser_1
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExternalUserEntity'
      responses:
        '200':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/users/registration/finalize:
    post:
      tags:
      - User Registration
      summary: Finalize user registration
      description: User registration must be enabled
      operationId: finalizeUserRegistration_1
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserEntity'
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '500':
          description: Internal server error
components:
  schemas:
    UserRoleEntity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
    RegisterUserEntity:
      required:
      - firstname
      - lastname
      - password
      - token
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        password:
          type: string
        token:
          type: string
    RoleScope:
      type: string
      enum:
      - API
      - APPLICATION
      - GROUP
      - ENVIRONMENT
      - ORGANIZATION
      - PLATFORM
    UserEntity:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        customFields:
          type: object
          additionalProperties:
            type: object
        displayName:
          type: string
          readOnly: true
        email:
          type: string
        envRoles:
          type: object
          additionalProperties:
            uniqueItems: true
            type: array
            items:
              $ref: '#/components/schemas/UserRoleEntity'
        firstConnectionAt:
          type: string
          format: date-time
        firstname:
          type: string
        id:
          type: string
        lastConnectionAt:
          type: string
          format: date-time
        lastname:
          type: string
        loginCount:
          type: integer
          format: int64
        newsletterSubscribed:
          type: boolean
        number_of_active_tokens:
          type: integer
          format: int32
        password:
          type: string
        picture:
          type: string
        primary_owner:
          type: boolean
        roles:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/UserRoleEntity'
        source:
          type: string
        sourceId:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    NewExternalUserEntity:
      required:
      - email
      type: object
      properties:
        customFields:
          type: object
          additionalProperties:
            type: object
        email:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        newsletter:
          type: boolean
        picture:
          type: string
        source:
          type: string
        sourceId:
          type: string
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

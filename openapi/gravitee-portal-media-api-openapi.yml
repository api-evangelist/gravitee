openapi: 3.2.0
info:
  title: Gravitee.io - Management Portal Media API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Portal Media
paths:
  /organizations/{orgId}/environments/{envId}/portal/media/upload:
    post:
      tags:
      - Portal Media
      summary: Create a media for the portal
      description: User must have the PORTAL_DOCUMENTATION[CREATE] permission to use this service
      operationId: uploadPortalMedia
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  $ref: '#/components/schemas/FormDataBodyPart'
      responses:
        '200':
          description: Media successfully created
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/portal/media/{hash}:
    get:
      tags:
      - Portal Media
      summary: Retrieve a media
      operationId: getPortalMedia
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: A media
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Not found
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/portal/pages/{page}/media:
    get:
      tags:
      - Portal Media
      summary: Retrieve all media for a Portal page
      description: User must have the ENVIRONMENT_DOCUMENTATION[READ] permission to use this service
      operationId: getPortalPageMedia
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json: {}
    post:
      tags:
      - Portal Media
      summary: Attach a media to a portal page
      description: User must have the ENVIRONMENT_DOCUMENTATION[UPDATE] permission to use this service
      operationId: attachPortalPageMedia
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  $ref: '#/components/schemas/FormDataBodyPart'
                fileName:
                  type: string
      responses:
        '201':
          description: Media successfully added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEntity'
        '500':
          description: Internal server error
components:
  schemas:
    Visibility:
      type: string
      description: The visibility of the API regarding the portal.
      example: PUBLIC
      enum:
      - PUBLIC
      - PRIVATE
    BodyPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            parameters:
              type: object
              additionalProperties:
                type: string
            subtype:
              type: string
            type:
              type: string
            wildcardSubtype:
              type: boolean
            wildcardType:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
    PageSourceEntity:
      type: object
      properties:
        configuration:
          type: string
        type:
          type: string
    FormDataBodyPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        formDataContentDisposition:
          $ref: '#/components/schemas/FormDataContentDisposition'
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            parameters:
              type: object
              additionalProperties:
                type: string
            subtype:
              type: string
            type:
              type: string
            wildcardSubtype:
              type: boolean
            wildcardType:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        name:
          type: string
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
        simple:
          type: boolean
        value:
          type: string
    MessageBodyWorkers:
      type: object
    PageMediaEntity:
      type: object
      properties:
        attachedAt:
          type: string
          format: date-time
        mediaHash:
          type: string
        mediaName:
          type: string
    FormDataContentDisposition:
      type: object
      properties:
        creationDate:
          type: string
          format: date-time
        fileName:
          type: string
        modificationDate:
          type: string
          format: date-time
        name:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        type:
          type: string
    AccessControlEntity:
      type: object
      properties:
        referenceId:
          type: string
        referenceType:
          type: string
    ParameterizedHeader:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties:
            type: string
        value:
          type: string
    PageEntity:
      type: object
      properties:
        accessControls:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/AccessControlEntity'
        attached_media:
          type: array
          items:
            $ref: '#/components/schemas/PageMediaEntity'
        configuration:
          type: object
          additionalProperties:
            type: string
        content:
          type: string
        contentRevisionId:
          $ref: '#/components/schemas/PageRevisionId'
        contentType:
          type: string
        crossId:
          type: string
        excludedAccessControls:
          type: boolean
        excluded_groups:
          type: array
          items:
            type: string
        generalConditions:
          type: boolean
          readOnly: true
        homepage:
          type: boolean
        id:
          type: string
        lastContributor:
          type: string
        lastModificationDate:
          type: string
          format: date-time
        messages:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        name:
          type: string
        order:
          type: integer
          format: int32
        parentId:
          type: string
        parentPath:
          type: string
        published:
          type: boolean
        source:
          $ref: '#/components/schemas/PageSourceEntity'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/PageEntity'
        type:
          type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
    PageRevisionId:
      type: object
      properties:
        pageId:
          type: string
        revision:
          type: integer
          format: int32
    ContentDisposition:
      type: object
      properties:
        creationDate:
          type: string
          format: date-time
        fileName:
          type: string
        modificationDate:
          type: string
          format: date-time
        parameters:
          type: object
          additionalProperties:
            type: string
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        type:
          type: string
    MultiPart:
      type: object
      properties:
        bodyParts:
          type: array
          items:
            $ref: '#/components/schemas/BodyPart'
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            parameters:
              type: object
              additionalProperties:
                type: string
            subtype:
              type: string
            type:
              type: string
            wildcardSubtype:
              type: boolean
            wildcardType:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic

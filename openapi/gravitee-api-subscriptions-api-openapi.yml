openapi: 3.2.0
info:
  title: Gravitee.io - Management API Subscriptions API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: API Subscriptions
paths:
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscribers:
    get:
      tags:
      - API Subscriptions
      summary: List subscribers for the API
      description: User must have the MANAGE_SUBSCRIPTIONS permission to use this service
      operationId: getApiSubscribers
      parameters:
      - name: query
        in: query
        schema:
          type: string
      - name: exclude
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - PICTURE
            - OWNER
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Paged result of API subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationListItem'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions:
    get:
      tags:
      - API Subscriptions
      summary: List subscriptions for the API
      description: User must have the READ_SUBSCRIPTION permission to use this service
      operationId: getApiSubscriptions
      parameters:
      - name: plan
        in: query
        description: plan
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: application
        in: query
        description: application
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Comma separated list of Subscription status, default is ACCEPTED
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionStatus'
      - name: api_key
        in: query
        schema:
          type: string
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: expand
        in: query
        description: Expansion of data to return in subscriptions
        schema:
          type: array
          items:
            type: string
            enum:
            - keys
            - security
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Paged result of API's subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEntityPageResult'
        '500':
          description: Internal server error
    post:
      tags:
      - API Subscriptions
      summary: Subscribe to a plan
      description: User must have the MANAGE_SUBSCRIPTIONS permission to use this service
      operationId: createSubscriptionToApi
      parameters:
      - name: application
        in: query
        required: true
        schema:
          type: string
      - name: plan
        in: query
        required: true
        schema:
          type: string
      - name: customApiKey
        in: query
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubscriptionConfigurationEntity'
      responses:
        '201':
          description: Subscription successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Bad custom API Key format or custom API Key definition disabled
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions/_canCreate:
    get:
      tags:
      - API Subscriptions
      summary: Check a subscription can be created with given api key, and application
      description: User must have the API_SUBSCRIPTION:READ permission to use this service
      operationId: verifyApiKeyCreation
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
      - name: application
        in: query
        required: true
        schema:
          type: string
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: API Key creation successfully checked
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad API Key parameter
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/subscriptions/export:

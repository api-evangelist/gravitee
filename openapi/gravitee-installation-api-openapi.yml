openapi: 3.2.0
info:
  title: Gravitee.io APIM Management Installation API
  description: 'The Gravitee API Management (APIM) Management API is the administrative

    control plane for the Gravitee platform.'
  contact:
    name: GraviteeSource Team
    url: https://gravitee.io
    email: team-apim@graviteesource.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: https://{host}/management/v2
  description: APIM Management API v2 - default base URL
  variables:
    host:
      default: apim.example.com
      description: Hostname of the Gravitee APIM Management API
- url: https://{host}/management/v2/organizations/{orgId}
  description: APIM Management API v2 - per-organization base URL
  variables:
    host:
      default: apim.example.com
    orgId:
      default: DEFAULT
security:
- BasicAuth: []
- CookieAuth: []
- BearerAuth: []
tags:
- name: Installation
  description: Manage organizations, environments, and platform installation
paths:
  /environments:
    get:
      tags:
      - Installation
      operationId: listEnvironments
      summary: List Environments
      responses:
        '200':
          description: Environments
  /environments/{envId}:
    get:
      tags:
      - Installation
      operationId: getEnvironment
      summary: Get an Environment
      parameters:
      - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: The environment
  /organizations/{orgId}:
    get:
      tags:
      - Installation
      operationId: getOrganization
      summary: Get an Organization
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The organization
  /organizations/{orgId}/license:
    get:
      tags:
      - Installation
      operationId: getOrganizationLicense
      summary: Get the Organization License
      parameters:
      - in: path
        name: orgId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The license
components:
  parameters:
    EnvId:
      in: path
      name: envId
      required: true
      schema:
        type: string
      description: The environment identifier
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    CookieAuth:
      type: apiKey
      in: cookie
      name: Auth-Graviteeio-APIM
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

components:
  schemas:
    ConnectorListItem:
      type: object
      properties:
        description:
          type: string
        icon:
          type: string
        id:
          type: string
        name:
          type: string
        schema:
          type: string
        supportedTypes:
          type: array
          items:
            type: string
        version:
          type: string
    PlatformPluginEntity:
      type: object
      properties:
        category:
          type: string

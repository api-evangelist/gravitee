openapi: 3.2.0
info:
  title: Gravitee.io - Management 🧪 V4 - Entrypoints API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: 🧪 V4 - Entrypoints
paths:
  /organizations/{orgId}/environments/{envId}/v4/endpoints/{entrypoint}:
    get:
      tags:
      - 🧪 V4 - Entrypoints
      summary: 🧪 Get an entrypoint
      description: '⚠️ This resource is in alpha version. This implies that it is likely to be modified or even removed in future versions. ⚠️.


        User must have the ENVIRONMENT_API[READ] permission to use this service'
      operationId: getEntrypoint_2
      parameters:
      - name: entrypoint
        in: path
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Entrypoint plugin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPluginEntity'
        '404':
          description: Entrypoint not found
        '500':
          description: Internal server error

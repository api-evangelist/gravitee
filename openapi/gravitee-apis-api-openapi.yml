openapi: 3.2.0
info:
  title: Gravitee.io - Management APIs API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: APIs
paths:
  /organizations/{orgId}/environments/{envId}/apis:
    get:
      tags:
      - APIs
      summary: List APIs
      description: List all the APIs accessible to the current user.
      operationId: getApis
      parameters:
      - name: category
        in: query
        description: filter by category id
        schema:
          type: string
      - name: group
        in: query
        description: filter by group id
        schema:
          type: string
      - name: top
        in: query
        description: 'true if you only want Top APIs. default: false'
        schema:
          type: boolean
      - name: context-path
        in: query
        description: filter by context path
        schema:
          type: string
      - name: label
        in: query
        description: filter by label
        schema:
          type: string
      - name: state
        in: query
        description: 'filter by state: STARTED or STOPPED'
        schema:
          type: string
      - name: visibility
        in: query
        description: 'filter by visibility: PUBLIC or PRIVATE'
        schema:
          type: string
      - name: version
        in: query
        description: filter by version
        schema:
          type: string
      - name: executionMode
        in: query
        description: filter by execution mode
        schema:
          $ref: '#/components/schemas/ExecutionMode'
      - name: name
        in: query
        description: filter by full API Name
        schema:
          type: string
      - name: tag
        in: query
        description: filter by tag
        schema:
          type: string
      - name: portal
        in: query
        schema:
          type: boolean
      - name: crossId
        in: query
        description: filter by crossId
        schema:
          type: string
      - name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List accessible APIs for current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiListItem'
        '500':
          description: Internal server error
    post:
      tags:
      - APIs
      summary: Create an API
      description: User must have API_PUBLISHER or ADMIN role to create an API.
      operationId: createApi
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewApiEntity'
        required: true
      responses:
        '201':
          description: API successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/_paged:
    get:
      tags:
      - APIs
      summary: List APIs with pagination
      description: List all the APIs accessible to the current user with pagination.
      operationId: getApisPaged
      parameters:
      - name: category
        in: query
        description: filter by category id
        schema:
          type: string
      - name: group
        in: query
        description: filter by group id
        schema:
          type: string
      - name: top
        in: query
        description: 'true if you only want Top APIs. default: false'
        schema:
          type: boolean
      - name: context-path
        in: query
        description: filter by context path
        schema:
          type: string
      - name: label
        in: query
        description: filter by label
        schema:
          type: string
      - name: state
        in: query
        description: 'filter by state: STARTED or STOPPED'
        schema:
          type: string
      - name: visibility
        in: query
        description: 'filter by visibility: PUBLIC or PRIVATE'
        schema:
          type: string
      - name: version
        in: query
        description: filter by version
        schema:
          type: string
      - name: executionMode
        in: query
        description: filter by execution mode
        schema:
          $ref: '#/components/schemas/ExecutionMode'
      - name: name
        in: query
        description: filter by full API Name
        schema:
          type: string
      - name: tag
        in: query
        description: filter by tag
        schema:
          type: string
      - name: portal
        in: query
        schema:
          type: boolean
      - name: crossId
        in: query
        description: filter by crossId
        schema:
          type: string
      - name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: Page of APIs for current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListItemPagedResult'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/_search:
    post:
      tags:
      - APIs
      summary: Search for API using the search engine
      operationId: searchApis
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List accessible APIs for current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiListItem'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/_search/_paged:
    post:
      tags:
      - APIs
      summary: Search for API using the search engine
      operationId: searchPagedApis
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: order
        in: query
        schema:
          type: string
          description: By default, sort is ASC. If *field* starts with '-', the order sort is DESC. Currently, only **name** and **paths** are supported
          default: name
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List accessible APIs for current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiListItem'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/hooks:
    get:
      tags:
      - APIs
      summary: Get the list of available hooks
      operationId: getApiHooks
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hook'
  /organizations/{orgId}/environments/{envId}/apis/import:
    put:
      tags:
      - APIs
      summary: Update the API from the API definition
      description: Update the API from the API definition in JSON format either with json or via an URL
      operationId: updateWithDefinition
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              type: object
        required: true
      responses:
        '200':
          description: API successfully updated from API definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '403':
          description: Forbidden
        '500':
          description: Internal server error
    post:
      tags:
      - APIs
      summary: Create an API by importing an API definition
      description: Create an API by importing an existing API definition in JSON format.
      operationId: importApiDefinition
      parameters:
      - name: definitionVersion
        in: query
        schema:
          type: string
          default: 1.0.0
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonNode'
        required: true
      responses:
        '200':
          description: API successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/import-url:
    post:
      tags:
      - APIs
      summary: Create an API by importing a URL pointing to an API definition
      description: Create an API by importing an existing API definition via a URL
      operationId: importApiDefinitionUrl
      parameters:
      - name: definitionVersion
        in: query
        schema:
          type: string
          default: 1.0.0
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: API successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/import/swagger:
    post:
      tags:
      - APIs
      summary: Create an API definition from a Swagger descriptor
      operationId: importSwaggerApi
      parameters:
      - name: definitionVersion
        in: query
        schema:
          type: string
          default: 1.0.0
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ImportSwaggerDescriptorEntity'
        required: true
      responses:
        '201':
          description: API definition from Swagger descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/schema:
    get:
      tags:
      - APIs
      summary: Get the API configuration schema
      operationId: getApiFlowSchemaForm
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: API definition
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/verify:
    post:
      tags:
      - APIs
      summary: Check if an API match the following criteria
      operationId: verifyApi
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyApiParam'
      responses:
        '200':
          description: No API match the following criteria
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: API already exist with the following criteria
  /organizations/{orgId}/environments/{envId}/apis/{api}:
    get:
      tags:
      - APIs
      summary: Get the API
      description: User must have the READ permission on the API_DEFINITION to use this service on a private API.
      operationId: getApi
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: API definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
    put:
      tags:
      - APIs
      summary: Update the API
      description: User must have the MANAGE_API permission to use this service
      operationId: updateApi
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiEntity'
        required: true
      responses:
        '200':
          description: API successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
    post:
      tags:
      - APIs
      summary: Manage the API's lifecycle
      description: User must have the MANAGE_LIFECYCLE permission to use this service
      operationId: doApiLifecycleAction
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: action
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/LifecycleAction'
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '500':
          description: Internal server error
    delete:
      tags:
      - APIs
      summary: Delete the API
      description: User must have the DELETE permission to use this service
      operationId: deleteApi
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: closePlans
        in: query
        schema:
          type: boolean
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '204':
          description: API successfully deleted
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/_debug:
    post:
      tags:
      - APIs
      summary: Debug an API on gateway instances
      description: User must have the UPDATE permission on API_DEFINITION to use this service
      operationId: debugAPI
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DebugApiEntity'
      responses:
        '200':
          description: Debug session successfully started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/_migrate:
    post:
      tags:
      - APIs
      summary: Migrate the API definition to be used with Policy Studio
      description: User must have the MANAGE_API create permission to use this service
      operationId: migrateAPI
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: API definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/_promote:
    post:
      tags:
      - APIs
      summary: Promote the API to another environment
      description: User must have the API_DEFINITION update permission to use this service
      operationId: promoteAPI
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PromotionRequestEntity'
        required: true
      responses:
        '200':
          description: Promotion request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/background:
    get:
      tags:
      - APIs
      summary: Get the API's background
      description: User must have the READ permission to use this service
      operationId: getApiBackground
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: API's background
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/crd:
    get:
      tags:
      - APIs
      summary: Export the API definition in a GKO CRD format
      description: User must have the MANAGE_API permission to use this service
      operationId: exportApiCRD
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: removeIds
        in: query
        description: whether to remove all ids from the exported crd (default is false)
        schema:
          type: boolean
      - name: contextPath
        in: query
        description: the context path to assign to the exported crd (default is the existing context path of the exported API
        schema:
          type: string
      - name: version
        in: query
        description: the API version to assign to the exported crd (default is the existing version of the exported API
        schema:
          type: string
      - name: managementContextName
        in: query
        description: the management context name to assign to the exported crd (if not defined, no context is added)
        schema:
          type: string
      - name: managementContextNamespace
        in: query
        description: the management context namespace to assign to the exported crd (default is 'default')
        schema:
          type: string
          default: default
      - name: exclude
        in: query
        description: fields to exclude from the exported crd (default is none)
        schema:
          type: string
          default: ''
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: API definition
          content:
            application/yaml: {}
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/deploy:
    post:
      tags:
      - APIs
      summary: Deploy API to gateway instances
      description: User must have the MANAGE_LIFECYCLE permission to use this service
      operationId: deployApi
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/ApiDeploymentEntity'
      responses:
        '200':
          description: API successfully deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/duplicate:
    post:
      tags:
      - APIs
      summary: Duplicate the API
      description: User must have the MANAGE_API create permission to use this service
      operationId: duplicateAPI
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DuplicateApiEntity'
        required: true
      responses:
        '200':
          description: API definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEntity'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/apis/{api}/export:
    get:
      tags:
      - APIs
      summary: Export the API definition in JSON format
      description: User must have the MANAGE_API permission to use this service
      operationId: exportApiDefinition
      parameters:
      - name: api
        in: path
        description: The ID of the API
        required: true
        schema:
          type: string
      - name: version
        in: query
        schema:

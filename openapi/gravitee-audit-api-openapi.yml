openapi: 3.2.0
info:
  title: Gravitee.io - Management Audit API
  description: Some news resources are in alpha version. This implies that they are likely to be modified or even removed in future versions. They are marked with the 🧪 symbol
  version: 3.20.0
servers:
- url: http://localhost:8083/management
security:
- gravitee-auth: []
tags:
- name: Audit
paths:
  /organizations/{orgId}/audit:
    get:
      tags:
      - Audit
      summary: Retrieve audit logs for the environment
      description: User must have the ENVIRONMENT_AUDIT[READ] or ORGANIZATION_AUDIT[READ] permission to use this service
      operationId: getAudits
      parameters:
      - name: environment
        in: query
        schema:
          type: string
      - name: api
        in: query
        schema:
          type: string
      - name: application
        in: query
        schema:
          type: string
      - name: type
        in: query
        description: filter on the type of audit
        schema:
          $ref: '#/components/schemas/AuditType'
      - name: event
        in: query
        description: filter by the name of an event.
        schema:
          type: string
        example: APPLICATION_UPDATED, API_CREATED, METADATA_DELETED, ...
      - name: from
        in: query
        description: Timestamp used to define the start date of the time window to query
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        description: Timestamp used to define the end date of the time window to query
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        description: Number of elements per page
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of audits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntityMetadataPage'
        '500':
          description: Internal server error
  /organizations/{orgId}/audit/events:
    get:
      tags:
      - Audit
      summary: List available audit event type for the environment
      description: User must have the ENVIRONMENT_AUDIT[READ] or ORGANIZATION_AUDIT[READ] permission to use this service
      operationId: getAuditEvents
      parameters:
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/audit:
    get:
      tags:
      - Audit
      summary: Retrieve audit logs for the environment
      description: User must have the ENVIRONMENT_AUDIT[READ] or ORGANIZATION_AUDIT[READ] permission to use this service
      operationId: getAudits_1
      parameters:
      - name: environment
        in: query
        schema:
          type: string
      - name: api
        in: query
        schema:
          type: string
      - name: application
        in: query
        schema:
          type: string
      - name: type
        in: query
        description: filter on the type of audit
        schema:
          $ref: '#/components/schemas/AuditType'
      - name: event
        in: query
        description: filter by the name of an event.
        schema:
          type: string
        example: APPLICATION_UPDATED, API_CREATED, METADATA_DELETED, ...
      - name: from
        in: query
        description: Timestamp used to define the start date of the time window to query
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        description: Timestamp used to define the end date of the time window to query
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        description: Number of elements per page
        schema:
          type: integer
          format: int32
          default: 20
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of audits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntityMetadataPage'
        '500':
          description: Internal server error
  /organizations/{orgId}/environments/{envId}/audit/events:
    get:
      tags:
      - Audit
      summary: List available audit event type for the environment
      description: User must have the ENVIRONMENT_AUDIT[READ] or ORGANIZATION_AUDIT[READ] permission to use this service
      operationId: getAuditEvents_1
      parameters:
      - name: envId
        in: path
        description: The ID of the environment
        required: true
        schema:
          type: string
          default: DEFAULT
      - name: orgId
        in: path
        description: The ID of the Organization
        required: true
        schema:
          type: string
          default: DEFAULT
      responses:
        '200':
          description: List of audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '500':
          description: Internal server error
components:
  schemas:
    AuditEntityMetadataPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntity'
        metadata:
          type: object
          additionalProperties:
            type: string
        pageElements:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    AuditEntity:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        event:
          type: string
        id:
          type: string
        patch:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        referenceId:
          type: string
        referenceType:
          $ref: '#/components/schemas/AuditReferenceType'
        user:
          type: string
    AuditReferenceType:
      type: string
      enum:
      - ORGANIZATION
      - ENVIRONMENT
      - APPLICATION
      - API
    AuditType:
      type: string
      enum:
      - ORGANIZATION
      - ENVIRONMENT
      - APPLICATION
      - API
    AuditEvent:
      type: object
  securitySchemes:
    gravitee-auth:
      type: http
      scheme: basic
